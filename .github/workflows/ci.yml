name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Lint, test, evaluate, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: docqa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d docqa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Integration tests (real Postgres with pgvector)
        run: npm run test:integration
      - name: Evaluation against the offline mock model
        run: npm run eval
      - name: Production build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Production dependencies only: build tooling never ships.
      - run: npm audit --omit=dev --audit-level=high

  container:
    name: Container image and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack from the production images
        run: |
          JWT_SECRET="$(openssl rand -base64 48)"
          export JWT_SECRET
          docker compose --profile full up -d --build
          for _ in $(seq 1 40); do
            if curl -fsS http://localhost:3000/api/v1/health/ready >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose --profile full logs
          exit 1
      - name: Smoke test the API through the running container
        run: |
          bash scripts/smoke-auth.sh
          bash scripts/smoke-api.sh
      - name: Show logs when something failed
        if: failure()
        run: docker compose --profile full logs --no-color
      - name: Tear down
        if: always()
        run: docker compose --profile full down -v
