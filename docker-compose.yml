name: ai-document-qa

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: docqa
    ports:
      - '127.0.0.1:${DB_HOST_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d docqa']
      interval: 5s
      timeout: 3s
      retries: 10

  # `docker compose --profile full up --build` runs the production image end to end.
  migrate:
    profiles: ['full']
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/docqa
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    # Run the way ECS runs it: nothing writable but /tmp, which a Fargate volume makes root-owned.
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    init: true
    tmpfs: ['/tmp:mode=0755']

  app:
    profiles: ['full']
    build:
      context: .
      target: runner
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/docqa
      APP_ORIGIN: http://localhost:${APP_HOST_PORT:-3000}
      # Empty means the app refuses to boot with a clear message; `npm run setup` generates one.
      JWT_SECRET: ${JWT_SECRET:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Empty means the default; raise it (milliseconds per chunk) to watch the stages and try Stop.
      MOCK_LLM_CHUNK_DELAY_MS: ${MOCK_LLM_CHUNK_DELAY_MS:-}
    ports:
      - '127.0.0.1:${APP_HOST_PORT:-3000}:3000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    init: true
    tmpfs: ['/tmp:mode=0755']

volumes:
  pgdata:
